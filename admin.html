<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquidLaunch — 白名单管理 | BSC</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-deep:#030812; --bg-card:rgba(6,30,50,0.65); --bg-input:rgba(3,15,28,0.9);
      --border:rgba(0,212,255,0.15); --border-focus:rgba(0,212,255,0.5);
      --cyan:#00d4ff; --magenta:#ff2daa; --green:#00ffb2; --yellow:#ffe600;
      --red:#ff4757; --text1:#eaf6ff; --text2:#7eb8d8; --radius:14px;
    }
    html{font-family:'Inter','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text1);line-height:1.6;}
    body{min-height:100vh;background:radial-gradient(ellipse at top, rgba(20,10,40,1) 0%, var(--bg-deep) 60%);}

    .navbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);background:rgba(3,8,18,0.88);border-bottom:1px solid var(--border);}
    .navbar .container{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 24px;max-width:900px;margin:0 auto;}
    .logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;color:var(--text1)}
    .logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--magenta));display:flex;align-items:center;justify-content:center;font-size:1rem;}

    .main{max-width:700px;margin:0 auto;padding:28px 20px 80px}

    .wallet-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:12px;margin-bottom:22px;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2)}
    .wallet-bar.wb-conn{background:rgba(0,255,178,0.08);border-color:rgba(0,255,178,0.2)}
    .wd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .wd-r{background:var(--red)}
    .wd-g{background:var(--green)}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;border-radius:10px;font-weight:700;font-size:0.85rem;cursor:pointer;border:none;transition:.25s;font-family:inherit;}
    .btn-primary{background:linear-gradient(135deg,var(--cyan),#0099cc);color:#000;}
    .btn-primary:hover{transform:translateY(-1px)}
    .btn-danger{background:linear-gradient(135deg,var(--red),#c0392b);color:#fff}
    .btn-danger:hover{transform:translateY(-1px)}
    .btn-outline{background:transparent;border:1.5px solid var(--cyan);color:var(--cyan);font-size:0.82rem;padding:7px 15px;border-radius:8px;cursor:pointer}
    .btn-outline:hover{background:rgba(0,212,255,0.06)}
    .btn-sm{padding:7px 14px;font-size:0.8rem;border-radius:8px}
    .btn-full{width:100%;padding:12px;font-size:0.92rem}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

    input[type=text],textarea{padding:10px 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg-input);color:var(--text1);font-family:inherit;font-size:0.88rem;outline:none;transition:.25s;width:100%}
    input:focus,textarea:focus{border-color:var(--border-focus)}
    textarea{resize:vertical;min-height:100px;font-family:'Fira Code','Consolas',monospace}
    label{display:block;font-size:0.82rem;font-weight:600;color:var(--text2);margin-bottom:5px}

    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px}
    .card h4{font-size:0.94rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .card p.hint{font-size:0.78rem;color:var(--text2);line-height:1.5;margin-bottom:10px}

    .stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(0,0,0,0.25);margin-bottom:8px}
    .stat-row .label{font-size:0.8rem;color:var(--text2)}
    .stat-row .val{font-size:0.9rem;font-weight:700}
    .val-on{color:var(--green)}  .val-off{color:var(--text2)}

    .list-box{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;background:rgba(0,0,0,0.25);padding:8px}
    .list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.82rem;font-family:'Fira Code','Consolas',monospace}
    .list-item:last-child{border-bottom:none}
    .list-item .remove-btn{color:var(--red);cursor:pointer;font-size:0.75rem;padding:3px 8px;border-radius:5px;border:1px solid rgba(255,71,87,0.3);background:transparent}
    .list-item .remove-btn:hover{background:rgba(255,71,87,0.15)}
    .empty-list{text-align:center;color:var(--text2);font-size:0.82rem;padding:20px}

    .result-msg{padding:10px 14px;border-radius:8px;font-size:0.82rem;margin-top:10px;display:none}
    .result-msg.show{display:block}
    .result-msg.ok{background:rgba(0,255,178,0.08);border:1px solid rgba(0,255,178,0.2);color:var(--green)}
    .result-msg.err{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2);color:var(--red)}

    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;background:rgba(0,0,0,0.2)}
    .toggle-row .tl{font-size:0.85rem;font-weight:600}
    .ts{width:48px;height:26px;border-radius:13px;cursor:pointer;position:relative;transition:.3s;border:none;background:rgba(255,255,255,0.1)}
    .ts.on{background:var(--cyan)}
    .ts:after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:.3s}
    .ts.on:after{left:25px}

    .back-link{text-align:center;padding:24px 0}
    .back-link a{color:var(--cyan);text-decoration:none;font-size:0.88rem}
  </style>
</head>
<body>

<div class="navbar">
  <div class="container">
    <a class="logo" href="launch.html"><span class="logo-icon">🦑</span>SquidLaunch</a>
    <div style="font-size:0.78rem;color:var(--magenta);background:rgba(255,45,170,0.12);padding:3px 10px;border-radius:6px;font-weight:700">管理员</div>
  </div>
</div>

<div class="main">

  <div class="wallet-bar" id="wallet-box">
    <span class="wd wd-r"></span>
    <span style="flex:1;font-size:0.86rem">未连接钱包</span>
    <button class="btn btn-outline btn-sm" onclick="connectWallet()">连接钱包</button>
  </div>

  <div class="card">
    <h4>📋 代币合约地址</h4>
    <div style="display:flex;gap:8px">
      <input type="text" id="contractAddr" placeholder="0x..." style="font-family:'Fira Code',monospace" />
      <button class="btn btn-primary" id="loadBtn" onclick="loadContract()" disabled>加载</button>
    </div>
    <div class="result-msg" id="loadMsg"></div>
  </div>

  <div class="card" id="statusCard" style="display:none">
    <h4>📊 合约状态</h4>
    <div class="stat-row"><span class="label">代币名称</span><span class="val val-off" id="sName">—</span></div>
    <div class="stat-row"><span class="label">代币符号</span><span class="val val-off" id="sSym">—</span></div>
    <div class="stat-row"><span class="label">合约 Owner</span><span class="val val-off" id="sOwner" style="font-family:'Fira Code',monospace;font-size:0.78rem">—</span></div>
    <div class="stat-row"><span class="label">白名单模式</span><span class="val" id="sWLMode">—</span></div>
  </div>

  <div class="card" id="wlToggleCard" style="display:none">
    <div class="toggle-row">
      <div><div class="tl">白名单 Mint</div><div style="font-size:0.75rem;color:var(--text2)">关闭 = 任何人可 Mint</div></div>
      <button class="ts" id="wlToggle" onclick="toggleWhitelist()" disabled></button>
    </div>
    <div class="result-msg" id="wlToggleMsg"></div>
  </div>

  <div class="card" id="addWLCard" style="display:none">
    <h4>➕ 添加白名单</h4>
    <p class="hint">每行一个 BSC 地址，支持批量添加</p>
    <textarea id="wlAddInput" placeholder="0x...&#10;0x..."></textarea>
    <button class="btn btn-primary btn-full" style="margin-top:10px" id="addWlBtn" onclick="addToWhitelist()" disabled>确认添加</button>
    <div class="result-msg" id="addMsg"></div>
  </div>

  <div class="card" id="rmWLCard" style="display:none">
    <h4>➖ 移除白名单</h4>
    <div style="display:flex;gap:8px">
      <input type="text" id="wlRmInput" placeholder="0x..." style="font-family:'Fira Code',monospace" />
      <button class="btn btn-danger" id="rmWlBtn" onclick="removeFromWhitelist()" disabled>移除</button>
    </div>
    <div class="result-msg" id="rmMsg"></div>
  </div>

  <div class="back-link"><a href="launch.html">← 返回发射页面</a></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
<script>
var contract = null;
var tokenAddr = '';
var isOwner = false;

var ABI = [
  {"inputs":[],"name":"name","outputs":[{"type":"string"}],"stateMutability":"view","type":"function"},
  {"inputs":[],"name":"symbol","outputs":[{"type":"string"}],"stateMutability":"view","type":"function"},
  {"inputs":[],"name":"owner","outputs":[{"type":"address"}],"stateMutability":"view","type":"function"},
  {"inputs":[],"name":"whitelistOnly","outputs":[{"type":"bool"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"type":"address"}],"name":"whitelist","outputs":[{"type":"bool"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"type":"bool"}],"name":"setWhitelistOnly","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"type":"address[]"}],"name":"addToWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"type":"address"}],"name":"removeFromWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"}
];

async function connectWallet(){
  if(!window.ethereum){ alert('请安装 MetaMask'); return; }
  try {
    var accounts = await ethereum.request({method:'eth_requestAccounts'});
    onWalletConnected(accounts[0]);
  } catch(e){ alert('连接失败：'+(e.message||e)); }
}

function onWalletConnected(addr){
  var box = document.getElementById('wallet-box');
  box.className = 'wallet-bar wb-conn';
  box.innerHTML = '<span class="wd wd-g"></span><span style="flex:1;font-size:0.86rem">已连接：'+addr.slice(0,6)+'...'+addr.slice(-4)+'</span><button class="btn btn-outline btn-sm" onclick="disconnectWallet()">断开</button>';
  document.getElementById('loadBtn').disabled = false;
}

function disconnectWallet(){ location.reload(); }

async function loadContract(){
  var addr = document.getElementById('contractAddr').value.trim();
  var msg = document.getElementById('loadMsg');
  if(!addr){ showMsg('loadMsg','err','请输入合约地址'); return; }
  if(!web3.utils.isAddress(addr)){ showMsg('loadMsg','err','地址格式无效'); return; }

  tokenAddr = web3.utils.toChecksumAddress(addr);
  var web3js = new Web3(window.ethereum);
  contract = new web3js.eth.Contract(ABI, tokenAddr);

  try {
    var accounts = await ethereum.request({method:'eth_requestAccounts'});
    var myAddr = accounts[0];

    var name = await contract.methods.name().call();
    var sym  = await contract.methods.symbol().call();
    var own  = await contract.methods.owner().call();
    var wlOn = await contract.methods.whitelistOnly().call();

    isOwner = (own.toLowerCase() === myAddr.toLowerCase());

    document.getElementById('sName').textContent = name;
    document.getElementById('sSym').textContent = sym;
    document.getElementById('sOwner').textContent = own.slice(0,8)+'...'+own.slice(-6);
    document.getElementById('sWLMode').textContent = wlOn ? '开启（仅白名单可 Mint）' : '关闭（公开 Mint）';
    document.getElementById('sWLMode').className = wlOn ? 'val val-on' : 'val val-off';

    document.getElementById('wlToggle').className = wlOn ? 'ts on' : 'ts';

    document.getElementById('statusCard').style.display = '';
    document.getElementById('wlToggleCard').style.display = '';
    document.getElementById('addWLCard').style.display = '';
    document.getElementById('rmWLCard').style.display = '';

    if(isOwner){
      document.getElementById('wlToggle').disabled = false;
      document.getElementById('addWlBtn').disabled = false;
      document.getElementById('rmWlBtn').disabled = false;
      showMsg('loadMsg','ok','合约加载成功 — 你是 Owner，可管理白名单');
    } else {
      document.getElementById('wlToggle').disabled = true;
      document.getElementById('addWlBtn').disabled = true;
      document.getElementById('rmWlBtn').disabled = true;
      showMsg('loadMsg','ok','合约加载成功（非 Owner，仅可查看）');
    }
  } catch(e){
    showMsg('loadMsg','err','加载失败：'+(e.message||e));
    console.error(e);
  }
}

function showMsg(id, type, text){
  var el = document.getElementById(id);
  el.className = 'result-msg '+type+' show';
  el.textContent = text;
}

async function toggleWhitelist(){
  if(!isOwner || !contract) return;
  var msg = document.getElementById('wlToggleMsg');
  try {
    var cur = await contract.methods.whitelistOnly().call();
    var accounts = await ethereum.request({method:'eth_requestAccounts'});
    showMsg('wlToggleMsg','','请在钱包中确认...');
    await contract.methods.setWhitelistOnly(!cur).send({from: accounts[0]});

    document.getElementById('wlToggle').className = !cur ? 'ts on' : 'ts';
    document.getElementById('sWLMode').textContent = !cur ? '开启（仅白名单可 Mint）' : '关闭（公开 Mint）';
    document.getElementById('sWLMode').className = !cur ? 'val val-on' : 'val val-off';
    showMsg('wlToggleMsg','ok',!cur ? '白名单已开启' : '白名单已关闭');
  } catch(e){
    if((e.message||'').indexOf('user rejected')>=0) showMsg('wlToggleMsg','err','用户在钱包中取消');
    else showMsg('wlToggleMsg','err','失败：'+(e.message||e));
  }
}

async function addToWhitelist(){
  if(!isOwner || !contract) return;
  var text = document.getElementById('wlAddInput').value.trim();
  if(!text) return;

  var lines = text.split(/[\n\r]+/).map(function(l){return l.trim();}).filter(function(l){return l;});
  var addrs = [];
  for(var i=0;i<lines.length;i++){
    if(web3.utils.isAddress(lines[i])) addrs.push(web3.utils.toChecksumAddress(lines[i]));
  }
  if(addrs.length===0){ showMsg('addMsg','err','无有效地址'); return; }

  try {
    var accounts = await ethereum.request({method:'eth_requestAccounts'});
    showMsg('addMsg','','请在钱包中确认（添加 '+addrs.length+' 个）...');
    await contract.methods.addToWhitelist(addrs).send({from: accounts[0]});
    showMsg('addMsg','ok','成功添加 '+addrs.length+' 个地址');
    document.getElementById('wlAddInput').value = '';
  } catch(e){
    if((e.message||'').indexOf('user rejected')>=0) showMsg('addMsg','err','用户在钱包中取消');
    else showMsg('addMsg','err','失败：'+(e.message||e));
  }
}

async function removeFromWhitelist(){
  if(!isOwner || !contract) return;
  var addr = document.getElementById('wlRmInput').value.trim();
  if(!addr||!web3.utils.isAddress(addr)){ showMsg('rmMsg','err','请输入有效地址'); return; }

  try {
    var accounts = await ethereum.request({method:'eth_requestAccounts'});
    showMsg('rmMsg','','请在钱包中确认...');
    await contract.methods.removeFromWhitelist(web3.utils.toChecksumAddress(addr)).send({from: accounts[0]});
    showMsg('rmMsg','ok','已移除：'+addr);
    document.getElementById('wlRmInput').value = '';
  } catch(e){
    if((e.message||'').indexOf('user rejected')>=0) showMsg('rmMsg','err','用户在钱包中取消');
    else showMsg('rmMsg','err','失败：'+(e.message||e));
  }
}

// Auto-connect
(async function(){
  if(window.ethereum && ethereum.selectedAddress){
    onWalletConnected(ethereum.selectedAddress);
  }
  if(window.ethereum){
    ethereum.on('accountsChanged', function(accounts){
      if(accounts.length>0) onWalletConnected(accounts[0]);
      else disconnectWallet();
    });
  }
})();
</script>
</body>
</html>
