<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleToken — 白名单管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a;
      --gold:#f5c842; --amber:#ff8c00;
      --danger:#ef4444; --success:#34d399;
      --text:#f0ede8; --muted:#888; --border:rgba(255,255,255,.08);
      --font:'Space Grotesk',system-ui,sans-serif;
    }
    body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; padding:24px 16px; }
    .container { max-width:640px; margin:0 auto; }
    h1 { font-size:1.4rem; font-weight:700; color:var(--gold); margin-bottom:6px; }
    .sub { color:var(--muted); font-size:.82rem; margin-bottom:24px; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:18px; }
    .card-title { font-size:.95rem; font-weight:600; color:var(--gold); margin-bottom:14px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px; }
    .field input, .field textarea { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--font); font-size:.88rem; }
    .field input:focus, .field textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,200,66,.15); }
    .field textarea { height:100px; resize:vertical; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:10px 22px; border-radius:8px; font-family:var(--font); font-weight:600; font-size:.88rem; cursor:pointer; border:none; transition:all .2s; }
    .btn-gold { background:linear-gradient(135deg,var(--gold),var(--amber)); color:#0a0a0a; }
    .btn-gold:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(245,200,66,.3); }
    .btn-outline { background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.15); }
    .btn-outline:hover { border-color:var(--gold); color:var(--gold); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none!important; }
    .status { margin-top:12px; font-size:.8rem; padding:8px 12px; border-radius:8px; display:none; }
    .status.ok { display:block; background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.2); color:var(--success); }
    .status.err { display:block; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:var(--danger); }
    .chip { font-size:.72rem; color:var(--gold); background:rgba(245,200,66,.08); border:1px solid rgba(245,200,66,.2); padding:4px 12px; border-radius:50px; font-family:monospace; margin-top:10px; display:none; }
    .flex-gap { display:flex; gap:10px; flex-wrap:wrap; }
  </style>
</head>
<body>
<div class="container">
  <h1>&#128737; SimpleToken 白名单管理</h1>
  <div class="sub">连接钱包 &rarr; 输入已部署的 Token 合约地址 &rarr; 管理白名单</div>

  <div class="card">
    <div class="card-title">&#128376; 连接钱包</div>
    <button id="btnConnect" class="btn btn-outline" onclick="connectWallet()">连接钱包</button>
    <div id="walletInfo" class="chip"></div>
  </div>

  <div class="card">
    <div class="card-title">&#128269; 合约地址</div>
    <div class="field">
      <label>Token 合约地址（0x...）</label>
      <input type="text" id="contractAddr" placeholder="0x..." />
    </div>
    <button id="btnLoad" class="btn btn-outline" onclick="loadContract()">加载合约</button>
    <div id="contractStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="card-title">&#10004; 批量添加白名单</div>
    <div class="field">
      <label>地址列表（每行一个，或逗号分隔）</label>
      <textarea id="addAddresses" placeholder="0x1234...&#10;0xabcd...&#10;或 0x1234...,0xabcd..."></textarea>
      <div style="font-size:.7rem;color:var(--muted);margin-top:4px;">将批量调用 addToWhitelist(address[])</div>
    </div>
    <button id="btnAdd" class="btn btn-gold" onclick="addWhitelist()">添加白名单</button>
    <div id="addStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="card-title">&#10134; 移除白名单</div>
    <div class="field">
      <label>地址（单个）</label>
      <input type="text" id="rmAddr" placeholder="0x..." />
    </div>
    <button id="btnRrm" class="btn btn-outline" onclick="removeWhitelist()">移除</button>
    <div id="rmStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="card-title">&#128736; 白名单开关</div>
    <div class="flex-gap">
      <button id="btnWOn" class="btn btn-gold" onclick="setWhitelistMode(true)">&#128308; 开启白名单模式</button>
      <button id="btnWOff" class="btn btn-outline" onclick="setWhitelistMode(false)">关闭白名单模式</button>
    </div>
    <div id="wlStatus" class="status"></div>
  </div>
</div>

<script src="ethers.umd.min.js"></script>
<script src="contract_data.js"></script>
<script>
  var signer, userAddr, contract = null;

  async function connectWallet() {
    if (!window.ethereum) { alert('请安装 MetaMask！'); return; }
    try {
      await window.ethereum.request({ method: 'eth_requestAccounts' });
      var provider = new ethers.providers.Web3Provider(window.ethereum);
      signer   = provider.getSigner();
      userAddr = await signer.getAddress();
      var chip = document.getElementById('walletInfo');
      chip.textContent = '已连接：' + userAddr.slice(0,6) + '...' + userAddr.slice(-4);
      chip.style.display = 'inline-block';
      document.getElementById('btnConnect').textContent = '已连接';
      document.getElementById('btnConnect').disabled = true;
    } catch(e) { console.error(e); alert('连接钱包失败：' + e.message); }
  }

  async function loadContract() {
    if (!signer) { alert('请先连接钱包！'); return; }
    var addr = document.getElementById('contractAddr').value.trim();
    if (!addr) { alert('请输入合约地址！'); return; }
    try {
      contract = new ethers.Contract(addr, CONTRACT_DATA.ABI, signer);
      await contract.owner();
      var s = document.getElementById('contractStatus');
      s.className = 'status ok';
      s.textContent = '✅ 合约加载成功！Owner：' + await contract.owner();
    } catch(e) {
      var s2 = document.getElementById('contractStatus');
      s2.className = 'status err';
      s2.textContent = '❌ 加载失败：' + e.message;
    }
  }

  async function addWhitelist() {
    if (!contract) { alert('请先加载合约！'); return; }
    var raw = document.getElementById('addAddresses').value.trim();
    if (!raw) { alert('请输入地址！'); return; }
    var addrs = raw.split(/[\n,\s]+/).map(function(a) { return a.trim(); }).filter(function(a) { return a.length > 0; });
    if (addrs.length === 0) { alert('没有有效地址！'); return; }
    try {
      document.getElementById('btnAdd').disabled = true;
      var tx = await contract.addToWhitelist(addrs);
      await tx.wait(1);
      var s = document.getElementById('addStatus');
      s.className = 'status ok';
      s.textContent = '✅ 已添加 ' + addrs.length + ' 个地址到白名单';
      document.getElementById('addAddresses').value = '';
    } catch(e) {
      var s2 = document.getElementById('addStatus');
      s2.className = 'status err';
      s2.textContent = '❌ 失败：' + e.message;
    } finally { document.getElementById('btnAdd').disabled = false; }
  }

  async function removeWhitelist() {
    if (!contract) { alert('请先加载合约！'); return; }
    var addr = document.getElementById('rmAddr').value.trim();
    if (!addr) { alert('请输入地址！'); return; }
    try {
      document.getElementById('btnRrm').disabled = true;
      var tx = await contract.removeFromWhitelist(addr);
      await tx.wait(1);
      var s = document.getElementById('rmStatus');
      s.className = 'status ok';
      s.textContent = '✅ 已从白名单移除：' + addr;
      document.getElementById('rmAddr').value = '';
    } catch(e) {
      var s2 = document.getElementById('rmStatus');
      s2.className = 'status err';
      s2.textContent = '❌ 失败：' + e.message;
    } finally { document.getElementById('btnRrm').disabled = false; }
  }

  async function setWhitelistMode(on) {
    if (!contract) { alert('请先加载合约！'); return; }
    try {
      var btn = on ? document.getElementById('btnWOn') : document.getElementById('btnWOff');
      btn.disabled = true;
      var tx = await contract.setWhitelistOnly(on);
      await tx.wait(1);
      var s = document.getElementById('wlStatus');
      s.className = 'status ok';
      s.textContent = '✅ 白名单模式：' + (on ? '已开启' : '已关闭');
    } catch(e) {
      var s2 = document.getElementById('wlStatus');
      s2.className = 'status err';
      s2.textContent = '❌ 失败：' + e.message;
    } finally {
      document.getElementById('btnWOn').disabled = false;
      document.getElementById('btnWOff').disabled = false;
    }
  }
</script>
</body>
</html>
