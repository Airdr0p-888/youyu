<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquidLaunch — 一键发射代币</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    :root {
      --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a; --bg4:#242424;
      --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
      --gold:#f5c842; --gold2:#e8a020; --amber:#ff8c00;
      --danger:#ef4444; --success:#34d399; --text:#f0ede8; --muted:#888;
      --focus:rgba(245,200,66,.35); --radius:10px;
      --font:'Space Grotesk',system-ui,sans-serif; --mono:'Space Mono',monospace;
    }
    body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; min-height:100vh; }
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.4;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }
    header { position:sticky; top:0; z-index:200; background:rgba(10,10,10,.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
    nav { max-width:1100px; margin:0 auto; padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:68px; }
    .logo { display:flex; align-items:center; gap:11px; text-decoration:none; }
    .logo-icon { width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg,var(--gold),var(--amber)); display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:0 0 16px rgba(245,200,66,.25); }
    .logo-name strong { font-size:1.05rem; font-weight:700; color:var(--gold); letter-spacing:1.5px; display:block; line-height:1.1; }
    .logo-name span { font-size:.62rem; color:var(--muted); letter-spacing:2.5px; text-transform:uppercase; }
    .nav-right { display:flex; align-items:center; gap:10px; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 20px; border-radius:8px; font-family:var(--font); font-weight:600; font-size:.875rem; cursor:pointer; text-decoration:none; border:none; transition:all .2s; }
    .btn-gold { background:linear-gradient(135deg,var(--gold),var(--amber)); color:#0a0a0a; }
    .btn-gold:hover { transform:translateY(-2px); box-shadow:0 4px 24px rgba(245,200,66,.35); }
    .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border2); }
    .btn-outline:hover { border-color:var(--gold); color:var(--gold); }
    .wallet-chip { font-size:.8rem; color:var(--gold); font-family:var(--mono); background:rgba(245,200,66,.08); border:1px solid rgba(245,200,66,.2); padding:5px 14px; border-radius:50px; display:none; }
    .page-hero { text-align:center; padding:60px 24px 44px; position:relative; z-index:1; }
    .hero-label { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(245,200,66,.25); background:rgba(245,200,66,.04); padding:5px 16px; border-radius:50px; font-size:.72rem; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase; margin-bottom:18px; }
    .page-hero h1 { font-size:clamp(1.8rem,4vw,2.8rem); font-weight:700; letter-spacing:-1px; margin-bottom:10px; }
    .page-hero h1 span { color:var(--gold); }
    .page-hero p { color:var(--muted); font-size:.95rem; }
    .form-container { max-width:680px; margin:0 auto; padding:0 24px 80px; position:relative; z-index:1; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:24px; }
    .card-title { font-size:1rem; font-weight:600; color:var(--gold); margin-bottom:18px; display:flex; align-items:center; gap:8px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase; }
    .field input, .field select, .field textarea { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; color:var(--text); font-family:var(--font); font-size:.9rem; transition:border-color .2s; }
    .field input:focus, .field select:focus { outline:none; border-color:var(--gold); box-shadow:var(--focus); }
    .field .hint { font-size:.7rem; color:var(--muted); margin-top:4px; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .checkbox-field { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .checkbox-field input[type=checkbox] { width:18px; height:18px; accent-color:var(--gold); }
    .checkbox-field label { font-size:.85rem; color:var(--text); cursor:pointer; }
    .radio-group { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .radio-item { position:relative; }
    .radio-item input { position:absolute; opacity:0; pointer-events:none; }
    .radio-item label { display:inline-block; padding:8px 18px; border-radius:50px; border:1px solid var(--border2); font-size:.8rem; cursor:pointer; transition:all .2s; }
    .radio-item input:checked + label { border-color:var(--gold); color:var(--gold); background:rgba(245,200,66,.08); }
    .slider-row { display:flex; align-items:center; gap:14px; }
    .slider-row input[type=range] { flex:1; accent-color:var(--gold); }
    .slider-val { font-family:var(--mono); font-size:.85rem; color:var(--gold); min-width:48px; text-align:right; }
    .deploy-btn { width:100%; padding:16px; font-size:1.05rem; font-weight:700; border-radius:12px; margin-top:8px; }
    .result-box { background:var(--bg3); border:1px solid var(--border2); border-radius:var(--radius); padding:20px; margin-top:24px; display:none; }
    .result-box h3 { color:var(--success); margin-bottom:10px; }
    .result-box code { font-size:.72rem; line-height:1.8; word-break:break-all; color:var(--muted); }
    .result-box a { color:var(--gold); text-decoration:none; font-size:.82rem; }
    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:9998; display:none; align-items:center; justify-content:center; }
    .modal-box { background:var(--bg2); border:1px solid var(--border2); border-radius:16px; padding:36px 44px; text-align:center; min-width:320px; max-width:90vw; }
    .modal-icon { font-size:2.4rem; margin-bottom:12px; }
    .modal-title { font-size:1.1rem; font-weight:600; margin-bottom:8px; }
    .modal-desc { font-size:.82rem; color:var(--muted); }
    .modal-bar { width:100%; height:4px; background:var(--bg4); border-radius:2px; margin-top:18px; overflow:hidden; }
    .modal-bar-inner { height:100%; width:40%; background:var(--gold); border-radius:2px; animation:barPulse 1.2s ease-in-out infinite; }
    @keyframes barPulse { 0%,100%{width:30%} 50%{width:70%} }
    .hidden { display:none!important; }
  </style>
</head>
<body>

<header>
  <nav>
    <a class="logo" href="#">
      <div class="logo-icon">🦑</div>
      <div class="logo-name"><strong>SQUIDLAUNCH</strong><span>Token Launcher</span></div>
    </a>
    <div class="nav-right">
      <div class="wallet-chip" id="walletChip">未在连接</div>
      <button class="btn btn-outline" id="btnConnect" onclick="connectWallet()">连接钱包</button>
    </div>
  </nav>
</header>

<section class="page-hero">
  <div class="hero-label">🚀 FAIR LAUNCH PLATFORM</div>
  <h1>发射你的 <span>代币</span></h1>
  <p>一键部署代币合约到 BSC 链 — 支持 Mint 模式、开盘控制、白名单</p>
</section>

<div class="form-container">

  <!-- 基础信息 -->
  <div class="card">
    <div class="card-title">🪙 代币基础信息</div>
    <div class="row2">
      <div class="field">
        <label>代币名称</label>
        <input type="text" id="t_name" placeholder="e.g. Squid Token" />
      </div>
      <div class="field">
        <label>代币符号</label>
        <input type="text" id="t_symbol" placeholder="e.g. SQUID" maxlength="10" style="text-transform:uppercase" />
      </div>
    </div>
    <div class="field">
      <label>总供应量（代币个数，非 wei）</label>
      <input type="number" id="t_supply" placeholder="e.g. 1000000" min="1" />
      <div class="hint">合约自动 × 10^18</div>
    </div>
  </div>

  <!-- Mint 配置 -->
  <div class="card">
    <div class="card-title">💰 Mint 配置</div>
    <div class="row2">
      <div class="field">
        <label>Mint 单价（BNB / 代币）</label>
        <input type="number" id="t_mintPrice" placeholder="e.g. 0.001" step="any" min="0" />
      </div>
      <div class="field">
        <label>硬顶（BNB）</label>
        <input type="number" id="t_hardCap" placeholder="e.g. 100" step="any" min="0" />
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>预售占比（% 代币分配给 Mint 买家）</label>
        <input type="number" id="t_presalePct" placeholder="50" min="0" max="100" />
        <div class="hint">剩余代币归 Owner</div>
      </div>
      <div class="field">
        <label>加池子比例（% 每笔 Mint 中用于加池子的 BNB）</label>
        <input type="number" id="t_liqPct" placeholder="50" min="0" max="100" />
        <div class="hint">0 = 不加池子；推荐 30~60</div>
      </div>
    </div>
  </div>

  <!-- 税费 -->
  <div class="card">
    <div class="card-title">📊 税费 & 限制</div>
    <div class="field">
      <label>买入税（%）：<span id="buyTaxVal">0</span>%</label>
      <div class="slider-row">
        <input type="range" id="buyTaxSlider" min="0" max="25" value="0" oninput="buyTaxVal.textContent=this.value" />
      </div>
    </div>
    <div class="field">
      <label>卖出税（%）：<span id="sellTaxVal">0</span>%</label>
      <div class="slider-row">
        <input type="range" id="sellTaxSlider" min="0" max="25" value="0" oninput="sellTaxVal.textContent=this.value" />
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>单笔交易上限（% 总供应量）</label>
        <input type="number" id="t_maxTx" placeholder="100" min="0" max="100" />
      </div>
      <div class="field">
        <label>单钱包持仓上限（% 总供应量）</label>
        <input type="number" id="t_maxWallet" placeholder="100" min="0" max="100" />
      </div>
    </div>
  </div>

  <!-- 开盘模式 -->
  <div class="card">
    <div class="card-title">🕐 开盘模式</div>
    <div class="radio-group" id="openModeGroup">
      <div class="radio-item">
        <input type="radio" name="openMode" id="omAuto" value="auto" checked onchange="onOpenModeChange()" />
        <label for="omAuto">⏱ 定时开盘</label>
      </div>
      <div class="radio-item">
        <input type="radio" name="openMode" id="omManual" value="manual" onchange="onOpenModeChange()" />
        <label for="omManual">✋ 手动开盘</label>
      </div>
      <div class="radio-item">
        <input type="radio" name="openMode" id="omFull" value="full" onchange="onOpenModeChange()" />
        <label for="omFull">🔥 满额开盘</label>
      </div>
    </div>
    <div class="field hidden" id="fOpenTime">
      <label>开盘时间</label>
      <input type="datetime-local" id="t_openTime" />
    </div>
    <div class="field hidden" id="fFullDelay">
      <label>达硬顶后延迟开盘（秒）</label>
      <input type="number" id="t_fullOpenDelay" placeholder="300" min="0" />
      <div class="hint">0 = 立即开盘</div>
    </div>
  </div>

  <!-- 白名单 -->
  <div class="card">
    <div class="card-title">🛡️ 白名单</div>
    <div class="checkbox-field">
      <input type="checkbox" id="whitelistChk" />
      <label for="whitelistChk">仅白名单地址可 Mint（部署后通过管理页面添加白名单）</label>
    </div>
  </div>

  <!-- Vanity 地址 -->
  <div class="card">
    <div class="card-title">✨ 靓号地址（可选）</div>
    <div class="field">
      <label>尾号后缀（合约地址以该字符串结尾，空 = 随机地址）</label>
      <input type="text" id="vanitySuffix" placeholder="e.g. 6666" maxlength="8" />
      <div class="hint">越长碰撞越慢；4 位约需 20 万次尝试，8 位可能需要数亿次</div>
    </div>
  </div>

  <!-- 部署 -->
  <button class="btn btn-gold deploy-btn" id="btnLaunch" onclick="deployToken()">🚀 立即发射代币</button>

  <!-- 结果 -->
  <div class="result-box" id="deployResult">
    <h3>✅ 部署成功！</h3>
    <div style="margin-bottom:10px">
      <a href="#" id="bscLink" target="_blank">在 BscScan 查看合约 →</a>
    </div>
    <div id="constructorArgs" style="margin-top:10px"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">⏳</div>
    <div class="modal-title" id="modalTitle">部署中...</div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-bar"><div class="modal-bar-inner"></div></div>
  </div>
</div>

<script src="ethers.umd.min.js"></script>
<script src="contract_data.js"></script>
<script src="vanity_deployer_data.js"></script>
<script>
/* ── Globals ── */
var signer, userAddr;
var currentOpenMode = 'auto';

var PLATFORM_WALLET = '0x8fDb0a964BEDA0dA705d2Fe5af2fb9a7001CBb36';
var PANCAKE_ROUTER   = '0x10ED43C718714eb63d5aA57B78B54704E256024E';

/* ── Open mode toggle ── */
function onOpenModeChange() {
  currentOpenMode = document.querySelector('input[name="openMode"]:checked').value;
  document.getElementById('fOpenTime').classList.toggle('hidden', currentOpenMode !== 'auto');
  document.getElementById('fFullDelay').classList.toggle('hidden', currentOpenMode !== 'full');
}

/* ── Modal ── */
function openModal()  { document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function setModalStatus(title, desc, icon) {
  if (title) document.getElementById('modalTitle').textContent = title;
  if (desc)  document.getElementById('modalDesc').textContent  = desc;
  if (icon)  document.getElementById('modalIcon').textContent  = icon;
}

/* ── Wallet ── */
async function connectWallet() {
  if (!window.ethereum) { alert('请安装 MetaMask！'); return; }
  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    var provider = new ethers.providers.Web3Provider(window.ethereum);
    signer   = provider.getSigner();
    userAddr = await signer.getAddress();
    document.getElementById('walletChip').textContent = userAddr.slice(0,6) + '...' + userAddr.slice(-4);
    document.getElementById('walletChip').style.display = 'inline-block';
    document.getElementById('btnConnect').textContent = '已连接';
    document.getElementById('btnConnect').disabled = true;
  } catch(e) { console.error(e); alert('连接钱包失败：' + e.message); }
}

/* ═══════════ Vanity Deployer (CREATE2) ═══════════ */
var VANITY_FACTORY_ADDR = localStorage.getItem('vanity_factory_addr') || '';

async function ensureVanityFactory(signer) {
  if (VANITY_FACTORY_ADDR) return VANITY_FACTORY_ADDR;
  setModalStatus('🚀 部署 CREATE2 工厂合约...', '请确认钱包交易', '🚀');
  try {
    var factoryFactory = new ethers.ContractFactory(VANITY_DEPLOYER_ABI, VANITY_DEPLOYER_BYTECODE, signer);
    var factoryContract = await factoryFactory.deploy();
    setModalStatus('等待工厂合约确认...', '区块确认中', '⏳');
    await factoryContract.deployTransaction.wait(1);
    VANITY_FACTORY_ADDR = factoryContract.address;
    localStorage.setItem('vanity_factory_addr', VANITY_FACTORY_ADDR);
    return VANITY_FACTORY_ADDR;
  } catch(e) { throw new Error('部署 Vanity 工厂失败：' + (e.reason || e.message)); }
}

async function findSaltForSuffix(suffix, creationCode, factoryAddr) {
  suffix = suffix.toLowerCase();
  var salt = ethers.utils.randomBytes(32);
  var maxAttempts = suffix.length <= 3 ? 50000 : (suffix.length <= 4 ? 200000 : 800000);
  var codeHash = ethers.utils.keccak256(creationCode);
  var attempts = 0;
  setModalStatus('🔍 碰撞靓号尾号 0x...' + suffix, '尝试次数：0', '🔍');
  while (attempts < maxAttempts) {
    var saltHex = ethers.utils.hexlify(salt);
    var encoded = ethers.utils.solidityPack(['bytes1','address','bytes32','bytes32'],['0xff',factoryAddr,saltHex,codeHash]);
    var addr = '0x' + ethers.utils.keccak256(encoded).slice(26);
    if (addr.toLowerCase().endsWith(suffix)) {
      return { salt: saltHex, address: addr };
    }
    var saltBN = ethers.BigNumber.from(saltHex);
    salt = ethers.utils.arrayify(saltBN.add(1).toHexString());
    if (salt.length < 32) salt = ethers.utils.zeroPad(salt, 32);
    attempts++;
    if (attempts % 10000 === 0) {
      setModalStatus('🔍 碰撞靓号 0x...' + suffix, '尝试次数：' + attempts, '🔍');
      await new Promise(r => setTimeout(r, 0));
    }
  }
  throw new Error('靓号尾号「' + suffix + '」在 ' + maxAttempts + ' 次尝试内未找到，请缩短尾号');
}

async function deployWithCreate2(creationCode, saltHex, factoryAddr, signer) {
  var factoryABI = [{"inputs":[{"name":"bytecode","type":"bytes"},{"name":"salt","type":"bytes32"}],"name":"deploy","outputs":[{"name":"addr","type":"address"}],"stateMutability":"nonpayable","type":"function"}];
  var factory = new ethers.Contract(factoryAddr, factoryABI, signer);
  setModalStatus('🚀 通过 CREATE2 部署中...', '请在钱包中确认交易', '🚀');
  var tx = await factory.deploy(creationCode, saltHex, { value: 0 });
  setModalStatus('等待确认...', '区块确认中', '⏳');
  var receipt = await tx.wait(1);
  var deployedAddr = null;
  for (var i = 0; i < receipt.logs.length; i++) {
    var log = receipt.logs[i];
    if (log.address.toLowerCase() === factoryAddr.toLowerCase() && log.topics.length >= 2) {
      deployedAddr = '0x' + log.topics[1].slice(26);
      break;
    }
  }
  if (!deployedAddr) {
    var codeHash = ethers.utils.keccak256(creationCode);
    var encoded = ethers.utils.solidityPack(['bytes1','address','bytes32','bytes32'],['0xff',factoryAddr,saltHex,codeHash]);
    deployedAddr = '0x' + ethers.utils.keccak256(encoded).slice(26);
  }
  return deployedAddr;
}

/* ═══════════ Deploy ═══════════ */
async function deployToken() {
  if (!signer) { alert('请先连接钱包！'); return; }

  // ── Read form ──
  var name    = (document.getElementById('t_name')?.value || '').trim();
  var symbol  = (document.getElementById('t_symbol')?.value || '').trim().toUpperCase();
  var supply  = parseInt(document.getElementById('t_supply')?.value) || 0;
  var mintPrice = parseFloat(document.getElementById('t_mintPrice')?.value) || 0;
  var hardCap   = parseFloat(document.getElementById('t_hardCap')?.value) || 0;
  var presalePct = parseInt(document.getElementById('t_presalePct')?.value) || 0;
  var liqPct     = parseInt(document.getElementById('t_liqPct')?.value) || 0;
  var buyTaxBps  = Math.round(parseFloat(document.getElementById('buyTaxSlider').value) * 100);
  var sellTaxBps = Math.round(parseFloat(document.getElementById('sellTaxSlider').value) * 100);
  var maxTxPct   = parseInt(document.getElementById('t_maxTx')?.value) || 0;
  var maxWalletPct = parseInt(document.getElementById('t_maxWallet')?.value) || 0;

  // Open mode
  var openModeNum = currentOpenMode === 'auto' ? 0 : currentOpenMode === 'manual' ? 1 : 2;
  var openTimeTs = 0, fullOpenDelay = 0;
  if (openModeNum === 0) {
    var v = document.getElementById('t_openTime')?.value;
    if (v) openTimeTs = Math.floor(new Date(v).getTime() / 1000);
  } else if (openModeNum === 2) {
    var d = document.getElementById('t_fullOpenDelay')?.value;
    fullOpenDelay = d ? parseInt(d) : 300;
  }

  var whitelistOnly = document.getElementById('whitelistChk')?.checked || false;

  // ── Validate ──
  if (!name || !symbol)     { alert('请填写代币名称和符号！'); return; }
  if (supply <= 0)           { alert('总供应量必须大于 0！'); return; }
  if (mintPrice <= 0)      { alert('Mint 单价必须大于 0！'); return; }
  if (hardCap <= 0)          { alert('硬顶必须大于 0！'); return; }
  if (presalePct < 0 || presalePct > 100)  { alert('预售占比必须在 0~100 之间！'); return; }
  if (liqPct < 0 || liqPct > 100)          { alert('加池子比例必须在 0~100 之间！'); return; }
  if (openModeNum === 0 && openTimeTs === 0)  { alert('定时模式请设置开盘时间！'); return; }

  var supplyWei    = ethers.utils.parseUnits(supply.toString(), 18);
  var mintPriceWei = ethers.utils.parseEther(mintPrice.toString());
  var hardCapWei   = ethers.utils.parseEther(hardCap.toString());

  openModal();
  setModalStatus('📦 编码构造函数参数...', '', '📦');

  try {
    var ABI      = CONTRACT_DATA.ABI;
    var BYTECODE = CONTRACT_DATA.BYTECODE;

    // Encode 18 flat constructor arguments
    var iface = new ethers.utils.Interface(ABI);
    var encodedArgs = iface.encodeDeploy([
      name,
      symbol,
      supplyWei,
      userAddr,
      PLATFORM_WALLET,
      PANCAKE_ROUTER,
      mintPriceWei,
      hardCapWei,
      ethers.BigNumber.from(presalePct.toString()),
      ethers.BigNumber.from(liqPct.toString()),
      ethers.BigNumber.from(buyTaxBps.toString()),
      ethers.BigNumber.from(sellTaxBps.toString()),
      ethers.BigNumber.from(maxTxPct.toString()),
      ethers.BigNumber.from(maxWalletPct.toString()),
      openModeNum,
      ethers.BigNumber.from(openTimeTs.toString()),
      ethers.BigNumber.from(fullOpenDelay.toString()),
      whitelistOnly
    ]).slice(2);

    var creationCode = BYTECODE + encodedArgs;
    var suffix = (document.getElementById('vanitySuffix')?.value || '').trim().toLowerCase().replace(/^0x/, '');
    var deployedAddr = null;

    if (suffix.length >= 1 && suffix.length <= 8) {
      try {
        var factoryAddr = await ensureVanityFactory(signer);
        setModalStatus('🔍 碰撞靓号尾号 0x...' + suffix, '计算中...', '🔍');
        var vanityResult = await findSaltForSuffix(suffix, creationCode, factoryAddr);
        deployedAddr = await deployWithCreate2(creationCode, vanityResult.salt, factoryAddr, signer);
      } catch(e) {
        if (confirm('靓号碰撞失败：' + e.message + '\n\n是否用随机地址继续部署？')) {
          suffix = '';
        } else { closeModal(); return; }
      }
    }

    if (!deployedAddr) {
      setModalStatus('🚀 部署代币合约...', '请在钱包中确认交易', '🚀');
      var factory = new ethers.ContractFactory(ABI, BYTECODE, signer);
      var contract = await factory.deploy(
        name, symbol,
        supplyWei,
        userAddr, PLATFORM_WALLET, PANCAKE_ROUTER,
        mintPriceWei, hardCapWei,
        ethers.BigNumber.from(presalePct.toString()),
        ethers.BigNumber.from(liqPct.toString()),
        ethers.BigNumber.from(buyTaxBps.toString()),
        ethers.BigNumber.from(sellTaxBps.toString()),
        ethers.BigNumber.from(maxTxPct.toString()),
        ethers.BigNumber.from(maxWalletPct.toString()),
        openModeNum,
        ethers.BigNumber.from(openTimeTs.toString()),
        ethers.BigNumber.from(fullOpenDelay.toString()),
        whitelistOnly
      );
      setModalStatus('⏳ 等待确认...', '区块确认中', '⏳');
      await contract.deployTransaction.wait(1);
      deployedAddr = contract.address;
    }

    // ── Success ──
    closeModal();
    document.getElementById('deployResult').style.display = 'block';
    document.getElementById('bscLink').href = 'https://bscscan.com/address/' + deployedAddr;
    var modeText = openModeNum === 0 ? '定时开盘（' + (document.getElementById('t_openTime')?.value || '') + '）' :
                  openModeNum === 1 ? '手动开盘（部署后需调用 enableTrading）' :
                  '满额开盘（硬顶达 ' + hardCap + ' BNB 后自动开盘）';
    document.getElementById('constructorArgs').innerHTML =
      '<code style="font-size:.72rem;line-height:1.8;word-break:break-all;display:block;color:var(--muted)">' +
      'Token: ' + deployedAddr + '<br>' +
      'Owner: ' + userAddr + '<br>' +
      'Platform: ' + PLATFORM_WALLET + '<br>' +
      'OpenMode: ' + ['定时','手动','满额'][openModeNum] + '<br>' +
      'Whitelist: ' + (whitelistOnly ? '仅白名单' : '公开') + '<br>' +
      'MintPrice: ' + mintPrice + ' BNB / token<br>' +
      'HardCap: ' + hardCap + ' BNB' +
      '</code>';
    document.getElementById('deployResult').scrollIntoView({behavior:'smooth'});
    document.getElementById('btnLaunch').textContent = '部署成功 ✓';
    document.getElementById('btnLaunch').disabled = true;

  } catch(e) {
    closeModal();
    console.error(e);
    var raw = e.message || String(e);
    var msg = '';

    // Custom error selectors
    var errMap = {
      '0x6bba5127': '代币名称或符号为空',
      '0x9fbba64f': '供应量必须大于 0',
      '0x3e0b457e': 'Owner 地址无效',
      '0xe528e11e': 'Mint 单价必须大于 0',
      '0x94a0c025': '预售占比不能超过 100%',
      '0x2bf9788d': '流动性占比不能超过 100%',
      '0xeb1967ad': '开盘模式无效（0=定时 1=手动 2=满额）',
      '0xbc1c5436': '交易限制不能超过 100%',
      '0xaf1ee134': '买入/卖出税率不能超过 25%'
    };
    var allHex = (e.data || '') + raw;
    for (var sel in errMap) {
      if (allHex.indexOf(sel) >= 0) { msg = errMap[sel]; break; }
    }

    if (!msg) {
      if (raw.indexOf('user rejected') >= 0) msg = '用户在钱包中取消';
      else if (raw.indexOf('insufficient funds') >= 0) msg = '余额不足';
      else if (raw.indexOf('execution reverted') >= 0) msg = '交易执行失败 — 请检查所有参数是否填写正确';
      else if (raw.indexOf('nonce too low') >= 0) msg = 'Nonce 冲突，请刷新页面重试';
      else if (raw.indexOf('replacement fee') >= 0 || raw.indexOf('underpriced') >= 0) msg = 'Gas 太低，请提高 Gas 设置';
      else msg = raw.substring(0, 300);
    }

    alert('部署失败：' + msg + '\n\n原始错误：' + raw.substring(0, 300));
    document.getElementById('btnLaunch').textContent = '🚀 立即发射代币';
    document.getElementById('btnLaunch').disabled = false;
  }
}
</script>
</body>
</html>
